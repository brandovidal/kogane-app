name: Deploy

# P10 (D52, D53): tests → astro build with the Cloudflare adapter → wrangler deploy (Worker kogane-app).
# The Worker is private with Cloudflare Access; API_URL and API_KEY are Worker secrets (docs/deploy.md).
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Build (Cloudflare adapter)
        run: pnpm build
        env:
          NODE_ENV: production
          ASTRO_ADAPTER: cloudflare
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
