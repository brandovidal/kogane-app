<style>
body{margin:0}

font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;color:var(--foreground);background:oklch(0.12 0.012 258);width:2000px;height:1000px;padding:60px 48px;box-sizing:border-box;display:flex;gap:40px;align-items:flex-start;overflow:hidden}
