<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sheet historial: filtro Archivos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.k{--background:oklch(0.17 0.014 258);--foreground:oklch(0.975 0.006 255);--border:oklch(0.29 0.016 258);--mf:oklch(0.72 0.02 258);--accent:oklch(0.29 0.016 258);--muted:oklch(0.215 0.015 258);--blue:oklch(0.488 0.243 264.376);--blue-t:oklch(0.72 0.14 264);--green:oklch(0.696 0.17 162.48);--red:oklch(0.637 0.237 25.331);--r:8px;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;color:var(--foreground);background:var(--background);width:520px;height:900px;position:relative;overflow:hidden}
.k *{box-sizing:border-box}
.k svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.k button{font:inherit;color:inherit;cursor:pointer}
.bg{position:absolute;inset:0;padding:100px 28px;display:flex;flex-direction:column;gap:16px;opacity:.5}
.bg i{display:block;height:56px;border:1px solid var(--border);border-radius:12px}
.ov{position:absolute;inset:0;background:rgb(0 0 0/.6)}
.sheet{position:absolute;top:0;right:0;bottom:0;width:520px;background:var(--background);border-left:1px solid var(--border);display:flex;flex-direction:column}
.sh{padding:20px 24px 0;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--border)}
.ttl{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ttl h2{margin:0;font-size:18px;font-weight:600}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--mf)}
.st{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:99px;font-size:12px;font-weight:500;background:oklch(0.488 0.243 264.376 / .2);color:var(--blue-t)}
.st i{width:6px;height:6px;border-radius:50%;background:currentColor}
.x{border:0;background:none;color:var(--mf);width:32px;height:32px;border-radius:6px;display:grid;place-items:center}
.tabs{display:flex;gap:20px}
.tabs button{border:0;background:none;padding:0 0 12px;color:var(--mf);font-weight:500;display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--foreground);border-color:var(--foreground)}
.tabs .n{font-size:11px;background:var(--accent);border-radius:99px;padding:0 6px;line-height:16px;color:var(--foreground)}
.tb{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--border)}
.seg{display:inline-flex;background:var(--muted);border-radius:var(--r);padding:3px;gap:2px}
.seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--mf);font-weight:500}
.seg button.on{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgb(0 0 0/.4)}
.tb small{font-size:12px;color:var(--mf)}
.sb{flex:1;overflow:hidden;padding:16px 24px;display:flex;flex-direction:column;gap:4px;position:relative}
.day{font-size:12px;font-weight:600;color:var(--mf);text-transform:uppercase;letter-spacing:.06em;padding:4px 0 10px;position:sticky;top:0}
.ev{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.ev::before{content:"";position:absolute;left:13px;top:30px;bottom:0;width:1px;background:var(--border)}
.ev.last::before{display:none}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--muted);border:1px solid var(--border);color:var(--mf)}
.dot svg{width:13px;height:13px}
.dot.st-c{color:var(--blue-t);background:oklch(0.488 0.243 264.376 / .15);border-color:transparent}
.dot.fi-c{color:var(--green);background:oklch(0.696 0.17 162.48 / .15);border-color:transparent}
.hd{display:flex;align-items:center;gap:8px;min-height:28px;font-size:13px}
.hd b{font-weight:600}
.hd .t{margin-left:auto;font-size:12px;color:var(--mf);font-variant-numeric:tabular-nums}
.src{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mf)}
.src svg{width:12px;height:12px}
.diff{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.old{color:var(--mf);text-decoration:line-through;font-variant-numeric:tabular-nums}
.new{font-weight:500;font-variant-numeric:tabular-nums;background:oklch(0.696 0.17 162.48 / .12);padding:1px 6px;border-radius:4px}
.arr{color:var(--mf)}
.arr svg{width:14px;height:14px}
.long{margin-top:6px;border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--mf);display:flex;flex-direction:column;gap:6px}
.long .o{text-decoration:line-through;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.long button{border:0;background:none;color:var(--blue-t);font-size:12px;padding:0;text-align:left;font-weight:500}
.more{margin:4px 0 0 40px;height:34px;border:1px solid var(--border);border-radius:var(--r);background:none;color:var(--mf);font-size:13px}
.fade{position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--background))}
.sf{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;color:var(--mf);font-size:13px}
.btn{height:36px;padding:0 16px;border-radius:var(--r);border:1px solid var(--border);background:none;font-weight:500;display:inline-flex;align-items:center;gap:8px;color:var(--foreground)}

/* === Tema Kogane login === */
.k{--background:#101114;--surface:#101114;--sidebar:#0d0e11;--border:rgb(255 255 255/.1);--accent:rgb(255 255 255/.08);--muted:rgb(255 255 255/.045);--mf:rgb(255 255 255/.55);--faint:rgb(255 255 255/.35);--foreground:#fff;--blue:oklch(0.585 0.233 277.117);--blue-t:oklch(0.87 0.065 274.039);--indigo:oklch(0.785 0.115 274.713);--green:oklch(0.845 0.143 164.978);--amber:oklch(0.879 0.169 91.605);--r:10px;
background:radial-gradient(ellipse at 20% 20%,rgba(72,94,180,.18),transparent 44%),radial-gradient(ellipse at 90% 85%,rgba(45,150,135,.12),transparent 38%),#090a0c}
.k .rail{background:var(--sidebar);border-color:var(--border)}
.k .logo{background:#fff;color:#101114;border-radius:12px}
.k .top{border-color:var(--border)}
.k .eb{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.22em;color:rgb(199 210 254/.8)}
.k h1{letter-spacing:-.02em}
.k .card,.k .kp,.k .tbl,.k .cd,.k .kc,.k .sheet,.k .dlg,.k .menu,.k .pop,.k .pane,.k .frame,.k .empty,.k .hv,.k .props,.k .cuo,.k .file{background:var(--surface);border-color:var(--border)}
.k .card,.k .kp,.k .tbl,.k .pane,.k .dlg{border-radius:18px}
.k .card .d,.k .kp .d{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:rgb(199 210 254/.75)}
.k .card.sel,.k .kp.sel{border-color:rgb(165 180 252/.45);box-shadow:0 0 0 3px rgb(165 180 252/.12)}
.k .chk{color:var(--blue-t)}
.k .inp,.k .sel,.k .c,.k .amt,.k .ta{background:rgb(255 255 255/.04);border-color:var(--border)}
.k .btn.pri,.k .split .btn,.k button.pri,.k .pri{background:#fff;color:#101114;border-color:#fff}
.k .split .btn:last-child{border-left-color:rgb(16 17 20/.15)}
.k .cn,.k .bd,.k .sh h2 .c{background:rgb(165 180 252/.16);color:var(--blue-t)}
.k .gb .c{color:var(--blue-t)}
.k .tr.h,.k .tr.ft{background:rgb(255 255 255/.025)}
.k .g1{background:rgb(255 255 255/.03)}
.k .mini i,.k .prog i[style*="0%"],.k .bar2 i,.k .pg i,.k .q .bar i{background:var(--indigo)}
.k .tool,.k .tl,.k .seg,.k .pm{background:rgb(255 255 255/.04);border-color:var(--border)}
.k .ov{background:rgb(5 6 8/.7)}

.cen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;flex:1}
.cen .big{width:64px;height:64px;border-radius:16px;background:var(--muted);display:grid;place-items:center;color:var(--mf)}
.cen .big svg{width:26px;height:26px}
.cen b{font-size:15px}.cen small{color:var(--mf);font-size:13px;max-width:280px;line-height:1.5}
.skl{border-radius:6px;background:linear-gradient(90deg,rgb(255 255 255/.04),rgb(255 255 255/.1),rgb(255 255 255/.04))}
.ev .th2{width:44px;height:44px;border-radius:8px;background:repeating-linear-gradient(45deg,#f4f4f5,#f4f4f5 4px,#d4d4d8 4px,#d4d4d8 8px);flex-shrink:0}
.fcard{margin-top:6px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:13px}
.fcard small{display:block;color:var(--mf);font-size:12px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgb(255 255 255/.2);border-top-color:var(--indigo)}
.full{margin-top:6px;border:1px solid var(--border);border-radius:var(--r);padding:12px;font-size:12.5px;display:flex;flex-direction:column;gap:10px;line-height:1.5}
.full .lb{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--mf)}
.full .o{color:var(--mf);word-break:break-word}
.full .n{color:var(--foreground);font-weight:500}
.full button{border:0;background:none;color:var(--blue-t);font-size:12px;padding:0;text-align:left;font-weight:500}
.bg,.ov{display:none}.sheet{border-left:0;width:520px}</style>
</helmet>
<div class="k">
  <div class="bg"><i></i><i></i><i style="height:140px"></i><i style="height:200px"></i></div>
  <div class="ov"></div>
  <aside class="sheet" aria-label="Detalle de Inmueble">
    <div class="sh">
      <div class="ttl">
        <div><h2 style="display:flex;align-items:center;gap:8px">Inmueble <span class="st"><i></i>Pagado</span></h2><div class="meta">Préstamo · Octubre 2026 · S/ 1,500.00</div></div>
        <div style="display:flex"><button class="x" aria-label="Abrir en pantalla completa"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button><button class="x" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Detalle</button>
        <button role="tab"><svg viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg>Archivos <span class="n">1</span></button>
        <button class="on" role="tab"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Historial <span class="n">10</span></button>
      </div>
    </div>
    <div class="tb"><div class="seg" role="radiogroup" aria-label="Tipo de cambio"><button role="radio">Todos</button><button role="radio">Ediciones</button><button role="radio">Estado</button><button class="on" role="radio">Archivos</button></div><small>Hora de Lima</small></div><div class="sb"><div class="day">Hoy · 2 de octubre</div><div class="ev"><span class="dot fi-c"><svg viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg></span><div><div class="hd"><b>Archivo agregado</b><span class="src"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg> Web</span><span class="t">02:44 p. m.</span></div><div class="fcard"><span class="th2"></span><div><b style="font-weight:500">photo_2026-10-02.jpg</b><small>Boleta · 52 KB</small></div></div></div></div><div class="ev last"><span class="dot fi-c"><svg viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg></span><div><div class="hd"><b>Tipo de archivo</b><span class="src"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg> Web</span><span class="t">02:45 p. m.</span></div><div class="diff"><span class="old">Sin tipo</span><span class="arr"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span><span class="new">Boleta</span></div></div></div></div><div class="sf"><span>2 cambios · filtro: Archivos</span><button class="btn">Cerrar</button></div>
  </aside>
</div>
</x-dc>

</html>
